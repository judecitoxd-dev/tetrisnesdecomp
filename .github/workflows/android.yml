name: Build Tetris DS Stage28 APK

on:
  push:
    branches: [tds-stage28-apk-build]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Stage23 base and apply Stage28 overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tds23 /tmp/tds28
          cat .tds-build/part* | base64 -d > /tmp/stage23-partial.zip || true
          python3 - <<'PY'
          import os, struct, zlib
          data=open('/tmp/stage23-partial.zip','rb').read(); out='/tmp/tds23'; i=0
          while True:
              j=data.find(b'PK\x03\x04', i)
              if j < 0: break
              try:
                  sig,ver,flag,method,mt,md,crc,cs,us,nl,el=struct.unpack_from('<IHHHHHIIIHH',data,j)
                  name=data[j+30:j+30+nl].decode('utf-8','replace'); ds=j+30+nl+el; comp=data[ds:ds+cs]
                  if len(comp)!=cs: break
                  rel=name.split('/',1)[1] if '/' in name else name
                  dest=os.path.join(out,rel)
                  if name.endswith('/'):
                      os.makedirs(dest,exist_ok=True)
                  else:
                      raw=comp if method==0 else zlib.decompress(comp,-15)
                      os.makedirs(os.path.dirname(dest),exist_ok=True)
                      open(dest,'wb').write(raw)
                  i=ds+cs
              except Exception:
                  i=j+4
          PY
          cp -a /tmp/tds23/. /tmp/tds28/
          cat .tds-stage28/part* | base64 -d > /tmp/stage28-overlay.tar.gz
          echo '9ee52774f3267049b14f5d79a7e73003832b715e9468f2e9fa86f770a236271a  /tmp/stage28-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/stage28-overlay.tar.gz -C /tmp/tds28
          cat > /tmp/tds28/android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.3.0' apply false
          }
          EOF
          cat > /tmp/tds28/android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'dev.jude.tdsnative'
              compileSdk 36
              defaultConfig {
                  applicationId 'dev.jude.tdsnative'
                  minSdk 26
                  targetSdk 36
                  versionCode 28
                  versionName '0.28-stage28-block9-retail'
                  externalNativeBuild { cmake { cppFlags '-std=c++20' } }
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
              }
              externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
              buildTypes {
                  debug { debuggable true }
                  release { minifyEnabled false }
              }
          }
          EOF
          test -f /tmp/tds28/src/core/RecordsScene.cpp
          test -f /tmp/tds28/android/app/src/main/cpp/CMakeLists.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Stage28 debug APK
        working-directory: /tmp/tds28/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/tds28/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" TetrisDS-native-stage28-block9-retail-debug.apk
          sha256sum TetrisDS-native-stage28-block9-retail-debug.apk
          unzip -t TetrisDS-native-stage28-block9-retail-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TetrisDS-native-stage28-block9-retail-apk
          path: TetrisDS-native-stage28-block9-retail-debug.apk
          if-no-files-found: error
