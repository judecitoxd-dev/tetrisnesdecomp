name: Build SML Native v13 APK

on:
  push:
    branches:
      - sml-native-v13-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore verified ARM64 native library
        working-directory: sml-v13-android-build
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cat native/libmain.part* | base64 --decode > libmain.so.xz
          xz --decompress libmain.so.xz
          echo "7ba2e9918ed1f9c349baa942dac54240991539ec22ee67a1157fdf7f1ae0b265  libmain.so" | sha256sum --check
          mv libmain.so app/src/main/jniLibs/arm64-v8a/libmain.so
          readelf -Ws app/src/main/jniLibs/arm64-v8a/libmain.so | grep ANativeActivity_onCreate

      - name: Build signed debug APK with AAPT2
        working-directory: sml-v13-android-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK structure and signature
        working-directory: sml-v13-android-build
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmain.so'
          unzip -l "$APK" | grep 'resources.arsc'
          unzip -l "$APK" | grep 'res/drawable'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          cp "$APK" SuperMarioLand_Native_Android_Fullscreen_ROMFidelity_v13.apk
          sha256sum SuperMarioLand_Native_Android_Fullscreen_ROMFidelity_v13.apk > apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioLand-Native-Android-v13
          path: |
            sml-v13-android-build/SuperMarioLand_Native_Android_Fullscreen_ROMFidelity_v13.apk
            sml-v13-android-build/apk-badging.txt
            sml-v13-android-build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
