name: Build PC port

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tetris-pc-v0.3-windows-x64
          - os: ubuntu-latest
            artifact: tetris-pc-v0.3-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTETRIS_FETCH_SDL2=${{ runner.os == 'Windows' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/docs
          Copy-Item build/Release/tetris_pc.exe dist/
          Copy-Item README.md dist/
          Copy-Item docs/PORT_STATUS.md,docs/ROM_MAP.md dist/docs/
      - name: Stage Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/docs
          cp build/tetris_pc README.md dist/
          cp docs/PORT_STATUS.md docs/ROM_MAP.md dist/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
