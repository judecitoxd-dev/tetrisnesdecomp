name: Build SML Native v13 APK

on:
  push:
    branches:
      - sml-native-v13-build
    paths-ignore:
      - 'sml-v13-android-build/output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sml-native-v13-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore verified ARM64 native library
        working-directory: sml-v13-android-build
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a output
          cat native/libmain.part* | base64 --decode > libmain.so.xz
          xz --decompress --force libmain.so.xz
          echo "7ba2e9918ed1f9c349baa942dac54240991539ec22ee67a1157fdf7f1ae0b265  libmain.so" | sha256sum --check
          mv libmain.so app/src/main/jniLibs/arm64-v8a/libmain.so
          readelf -Ws app/src/main/jniLibs/arm64-v8a/libmain.so | grep ANativeActivity_onCreate

      - name: Build and verify with official Android tools
        id: official_build
        working-directory: sml-v13-android-build
        shell: bash
        run: |
          set +e
          rm -rf output/*
          echo "$GITHUB_RUN_ID" > output/run-id.txt
          gradle --no-daemon --stacktrace :app:assembleDebug > output/build.log 2>&1
          BUILD_RC=$?
          echo "$BUILD_RC" > output/build-exit-code.txt
          if [ "$BUILD_RC" -eq 0 ]; then
            APK=app/build/outputs/apk/debug/app-debug.apk
            cp "$APK" output/SuperMarioLand_Native_Android_Fullscreen_ROMFidelity_v13.apk
            {
              echo "ZIP TEST"
              unzip -t "$APK"
              echo
              echo "REQUIRED ENTRIES"
              unzip -l "$APK" | grep -E 'AndroidManifest.xml|resources.arsc|res/drawable|lib/arm64-v8a/libmain.so|META-INF'
              echo
              echo "SIGNATURE"
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
              echo
              echo "BADGING"
              "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK"
            } > output/verification.txt 2>&1
            VERIFY_RC=$?
            echo "$VERIFY_RC" > output/verify-exit-code.txt
            sha256sum output/SuperMarioLand_Native_Android_Fullscreen_ROMFidelity_v13.apk > output/apk-sha256.txt
          else
            echo "build failed" > output/verification.txt
            echo "99" > output/verify-exit-code.txt
          fi
          exit 0

      - name: Commit build result to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sml-v13-android-build/output
          git commit -m "SML v13 Android official build result run ${GITHUB_RUN_ID}" || exit 0
          git push origin sml-native-v13-build

      - name: Require successful verified APK
        working-directory: sml-v13-android-build
        run: |
          test "$(cat output/build-exit-code.txt)" = "0"
          test "$(cat output/verify-exit-code.txt)" = "0"
          test -s output/SuperMarioLand_Native_Android_Fullscreen_ROMFidelity_v13.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioLand-Native-Android-v13
          path: sml-v13-android-build/output/
          if-no-files-found: error
          retention-days: 30
