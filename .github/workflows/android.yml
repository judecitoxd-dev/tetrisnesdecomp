name: Build Android port

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.22-continuous-apu-sampling

      - name: Update obsolete 4:3 settings expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/game_tests_v05_01.inc')
          text = path.read_text(encoding='utf-8')
          old = '    assert(loaded.window_width == 1234 && loaded.window_height == 777);'
          new = ('    assert(loaded.window_width == 1036 && loaded.window_height == 777);\n'
                 '    assert(loaded.window_width * 3 == loaded.window_height * 4);')
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          if ! git diff --quiet -- tests/game_tests_v05_01.inc; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/game_tests_v05_01.inc
            git commit -m "tests: verify normalized PC 4:3 window size"
            git push origin HEAD:v0.22-continuous-apu-sampling
          fi

      - name: Self-test ROM, audio and Android layout tools
        run: |
          python tools/rom_assets_verify.py --self-test
          python tools/type_a_ending_verify.py --self-test
          python tools/cathedral_verify.py --self-test
          python tools/trace_compare.py --self-test
          python tools/apu_matrix.py self-test
          python tools/build_audio_cache.py --self-test
          python tools/test_v022_layout_audio.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Fetch official SDL2 Android glue
        shell: bash
        run: |
          git clone --depth 1 --branch release-2.30.11 \
            https://github.com/libsdl-org/SDL.git .android-deps/SDL
          mkdir -p android/app/jni/SDL android/app/src/main/java/org/libsdl/app
          cp -R .android-deps/SDL/. android/app/jni/SDL/
          cp .android-deps/SDL/android-project/app/src/main/java/org/libsdl/app/*.java \
            android/app/src/main/java/org/libsdl/app/
          rm -rf .android-deps/SDL/android-project \
                 android/app/jni/SDL/android-project \
                 .android-deps/SDL/.git \
                 android/app/jni/SDL/.git

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Build debug APK v0.22 portrait handheld
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK excludes ROMs and rendered audio
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          if unzip -l "$APK" | grep -Ei '\.(nes|ttr|ogg|wav|csv)$'; then
            echo "Forbidden ROM/replay/audio/trace payload found in APK" >&2
            exit 1
          fi
          cp "$APK" Tetris-NES-Port-Android-v0.22-debug.apk
          sha256sum Tetris-NES-Port-Android-v0.22-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tetris-nes-port-android-v0.22
          path: Tetris-NES-Port-Android-v0.22-debug.apk
