name: Build Tetris DS Stage23 APK

on:
  push:
    branches: [tds-stage23-apk-build]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct buildable Stage23 source from uploaded payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tds-build/part{00..09} > /tmp/tds-stage23.b64
          base64 -d /tmp/tds-stage23.b64 > /tmp/tds-stage23.partial.zip
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          data=Path('/tmp/tds-stage23.partial.zip').read_bytes()
          out=Path('tds-stage23-src')
          pos=0; extracted=0
          while pos+30 <= len(data):
              if data[pos:pos+4] != b'PK\x03\x04':
                  nxt=data.find(b'PK\x03\x04', pos+1)
                  if nxt < 0: break
                  pos=nxt
                  continue
              sig,ver,flag,method,mtime,mdate,crc,csize,usize,nlen,xlen=struct.unpack_from('<IHHHHHIIIHH',data,pos)
              name=data[pos+30:pos+30+nlen].decode('utf-8','replace')
              dstart=pos+30+nlen+xlen
              dend=dstart+csize
              if dend > len(data): break
              comp=data[dstart:dend]
              if method == 0: raw=comp
              elif method == 8: raw=zlib.decompress(comp,-15)
              else:
                  pos=dend
                  continue
              p=out/name
              if name.endswith('/'):
                  p.mkdir(parents=True,exist_ok=True)
              else:
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(raw)
              extracted += 1
              pos=dend
          print('Extracted entries:', extracted)
          root=out/'TetrisDS-native-stage23-rom-fidelity'
          required=[
              root/'android/build.gradle',
              root/'android/settings.gradle',
              root/'android/app/build.gradle',
              root/'android/app/src/main/AndroidManifest.xml',
              root/'android/app/src/main/cpp/native_bridge.cpp',
              root/'android/app/src/main/cpp/CMakeLists.txt',
              root/'src/core/NativeSession.cpp',
              root/'src/core/StandardGame.cpp',
              root/'src/core/StandardRenderer.cpp',
          ]
          missing=[str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Missing build files: '+', '.join(missing))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build Stage23 debug APK
        working-directory: tds-stage23-src/TetrisDS-native-stage23-rom-fidelity/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK=tds-stage23-src/TetrisDS-native-stage23-rom-fidelity/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" TetrisDS-native-stage23-rom-fidelity-debug.apk
          sha256sum TetrisDS-native-stage23-rom-fidelity-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TetrisDS-native-stage23-rom-fidelity-apk
          path: TetrisDS-native-stage23-rom-fidelity-debug.apk
          if-no-files-found: error
