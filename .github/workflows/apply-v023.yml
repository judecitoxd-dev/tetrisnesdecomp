name: Apply v0.23 PRG verification patch

on:
  push:
    branches: [v0.23-prg-verification]
    paths:
      - tools/apply_v023_patch.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.23-prg-verification
      - name: Apply source, test and documentation patch
        run: python tools/apply_v023_patch.py
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.23: verify PRG semantics and restore NES timing rules"
          git push origin HEAD:v0.23-prg-verification
