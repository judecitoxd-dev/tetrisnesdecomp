name: Apply v0.23 manifest correction

on:
  push:
    branches: [v0.23-prg-verification]
    paths:
      - tools/fix_v023_manifest.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.23-prg-verification
      - run: python tools/fix_v023_manifest.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.23: correct ROM-derived routine signature hashes"
          git push origin HEAD:v0.23-prg-verification
