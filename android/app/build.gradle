plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ylports.tetrisnes'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.ylports.tetrisnes'
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName '0.9-android'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DTETRIS_ANDROID=ON'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
